# The gate gesso has to pass before anyone depends on a commit.
#
# One job per question, so a red tick says which failed: does the library hold,
# does it hold against a real PostgreSQL and a real MySQL, does the CLI generate
# code that builds and runs on both, and is it free of what the linter and the
# vulnerability database know.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # The newest 1.26 release, not whatever the runner image cached: a
          # standard-library security fix is a patch release.
          check-latest: true
          cache: true

      # The nested modules too: each is formatted, and each is vetted with its
      # own go.mod.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          (cd integration && go vet ./...)
          (cd cmd/gesso && go vet ./...)

      # -race is the point: the router, the caches, the locks and the worker are
      # all shared between goroutines.
      - name: go test -race
        run: go test -race ./...

  integration:
    name: integration (PostgreSQL, MySQL, Redis, S3)
    runs-on: ubuntu-latest
    # Real servers, given to the suites through GESSO_POSTGRES_DSN and
    # GESSO_MYSQL_DSN; without the first they would start an embedded
    # PostgreSQL, without the second skip MySQL. Each test creates a database of
    # its own, so the users need to create databases (both images' superusers
    # can).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gesso
          POSTGRES_PASSWORD: gesso
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gesso"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gesso
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgesso"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      # An S3 that checks signatures: Zenko CloudServer, its default keys.
      s3:
        image: zenko/cloudserver
        env:
          REMOTE_MANAGEMENT_DISABLE: '1'
        ports: ['8000:8000']
    env:
      GESSO_POSTGRES_DSN: postgres://gesso:gesso@localhost:5432/postgres?sslmode=disable
      GESSO_MYSQL_DSN: root:gesso@tcp(127.0.0.1:3306)/
      GESSO_REDIS_ADDR: 127.0.0.1:6379
      GESSO_S3_ENDPOINT: http://127.0.0.1:8000
      GESSO_S3_BUCKET: gesso-test
      GESSO_S3_ACCESS_KEY: accessKey1
      GESSO_S3_SECRET_KEY: verySecretKey1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: integration/go.sum

      - name: S3 bucket
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user accessKey1:verySecretKey1 \
            -X PUT http://127.0.0.1:8000/gesso-test

      # A skipped database test here would mean "unverified", not "passed":
      # with servers provided, a skip is a failure.
      - name: go test
        working-directory: integration
        run: |
          go test -count=1 -v ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if grep -q "UNVERIFIED" test.log; then
            echo "a database test skipped although a server was given"
            exit 1
          fi
          exit $status

  cli:
    name: cli
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gesso
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgesso"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      GESSO_MYSQL_DSN: root:gesso@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: cmd/gesso/go.sum

      # These tests scaffold and generate into temporary modules, then vet,
      # test and run them — on SQLite, on an embedded PostgreSQL the generated
      # tests download, and on the MySQL service — so a template that stops
      # compiling, or SQL a dialect refuses, fails here. A generated test that
      # skipped its database is reported UNVERIFIED, and fails the job.
      - name: go test
        working-directory: cmd/gesso
        run: |
          go test -count=1 -v ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if grep -q "UNVERIFIED" test.log; then
            echo "a generated test skipped its database"
            exit 1
          fi
          exit $status

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      # Pinned, so a new release of a tool cannot turn a commit red that was
      # green yesterday without anything here changing.
      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          (cd integration && go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...)
          (cd cmd/gesso && go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...)

      # Not pinned to a database snapshot: a vulnerability published today should
      # fail today's build. It reports only what the code calls. The integration
      # module is test-only and ships nothing, so it is not scanned.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          (cd cmd/gesso && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...)
